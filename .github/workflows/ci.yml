name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: pnpm install

      - name: Build shared package
        run: pnpm --filter @hang/shared build

      - name: Type check API
        run: pnpm --filter @hang/api lint

      - name: Type check mobile
        run: pnpm --filter @hang/mobile lint

  test-api:
    name: API unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: pnpm install

      - name: Build shared package
        run: pnpm --filter @hang/shared build

      - name: Generate Prisma client
        run: pnpm --filter @hang/api db:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hang_test

      - name: Run API unit tests
        run: pnpm --filter @hang/api test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hang_test
          JWT_SECRET: ci-test-secret-key-at-least-32-characters
          TWILIO_ACCOUNT_SID: test
          TWILIO_AUTH_TOKEN: test
          TWILIO_VERIFY_SERVICE_SID: test
          REDIS_URL: redis://localhost:6379

  test-api-integration:
    name: API integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hang_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: pnpm install

      - name: Build shared package
        run: pnpm --filter @hang/shared build

      - name: Run Prisma migrations
        run: pnpm --filter @hang/api db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hang_test

      - name: Run API integration tests
        run: pnpm --filter @hang/api test:integration
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hang_test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hang_test
          JWT_SECRET: ci-test-secret-key-at-least-32-characters
          TWILIO_ACCOUNT_SID: test
          TWILIO_AUTH_TOKEN: test
          TWILIO_VERIFY_SERVICE_SID: test
          REDIS_URL: redis://localhost:6379

  test-mobile:
    name: Mobile component tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: pnpm install

      - name: Run mobile tests
        run: pnpm --filter @hang/mobile test
        env:
          EXPO_PUBLIC_API_URL: http://localhost:3000/api/v1
